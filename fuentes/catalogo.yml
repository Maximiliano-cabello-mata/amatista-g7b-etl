# Catálogo de fuentes de G7B: el mapa de Geodar Radar (python -m geodar mapa).
#
# Una fuente solo se vigila si:  activa: true  Y  licencia_verificada: true  Y  su extractor no es externo
# (regla 4 del plan: sin licencia confirmada, no entra).
#
# familia (plan maestro, sección 2):
#   F1 telemetría de equipos · F2 formas optimizadas · F3 texturas · F4 herramientas
#   F5 técnicas y conocimiento · F6 aprendizaje · F7 modelos 3D
#
# destino (todo entra primero crudo a Azure, en bronce; después):
#   documentos   → embudo de calidad → MongoDB conocimiento_3d.documentos
#   catalogo     → MongoDB g7b_catalogo.<coleccion>
#   telemetria   → Azure: cubo DuckDB del warehouse
#   senales      → Azure: oro/senales/ (resumen semanal de lo que pregunta la comunidad)
#
# modo:
#   texto_completo   se guarda el texto (licencias abiertas: CC BY, CC BY-SA, CC0, GPL...)
#   solo_metadatos   título, enlace, fecha, etiquetas y cifras (derechos reservados)
#   agregados        solo cifras agregadas, nunca el contenido
#
# sensor.tipo:
#   atom | rss        un feed: entradas nuevas
#   pagina            la página con ETag / Last-Modified y huella del contenido
#   sitemap           URLs nuevas o con lastmod más reciente
#   stackexchange     API de Stack Exchange: preguntas con votos y su mejor respuesta
#   discourse         foro Discourse: temas nuevos con vistas, «me gusta» y respuestas (solo metadatos)
#   github_releases   versiones nuevas de repos de GitHub, con licencia y estrellas
#   json_api          API JSON con una lista de elementos: nuevos o cambiados
#   externo           otra tarea la trae (ver gestor); Geodar solo la muestra en el mapa
#
# extractor:
#   directo   el sensor ya trae el contenido: va directo a bronce
#   zyte      lanza una araña en Zyte ("paginas" o la de zyte.arana)
#   descarga  descarga el archivo (PDF) a bronce
#   externo   la trae otra tarea (gestor)
version: 2
fuentes:

  # ================================================================ F5 · técnicas y conocimiento

  - id: arxiv-cs-gr
    nombre: arXiv, gráficos por computadora (cs.GR)
    tipo: publicaciones
    programa: general
    familia: F5
    destino: documentos
    licencia: CC0-1.0          # metadatos y resúmenes de arXiv; el PDF de cada artículo tiene su propia licencia
    licencia_verificada: true
    modo: solo_metadatos
    preguntas: [P5]
    sensor:
      tipo: atom
      # La API de export.arxiv.org no permite robots en su robots.txt (la primera corrida dio 999):
      # se usa el feed oficial, que es para esto.
      url: "https://rss.arxiv.org/atom/cs.GR"
    extractor: directo
    umbrales: {valor_min: 0, valor_revision: 0}   # en un resumen académico el valor es la técnica
    frecuencia_horas: 24
    dominios: [rss.arxiv.org, arxiv.org]
    activa: true

