  - {patron: 'nvidia|geforce|quadro|rtx a\d', fabricante: nvidia, clase: dedicada}

  # --- AMD dedicadas ------------------------------------------------------------------------------
  - {patron: 'radeon ai pro r9700', fabricante: amd, clase: dedicada, vram_gb: 32}
