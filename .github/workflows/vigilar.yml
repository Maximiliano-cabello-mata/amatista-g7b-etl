name: Vigilar fuentes

# Cada 6 horas revisa las fuentes del catálogo a las que les toca (frecuencia_horas)
# y lanza la extracción solo si hay algo nuevo (docs/INGESTA.md).
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      fuente:
        description: "Solo esta fuente (id del catálogo); vacío = todas"
        type: string
        default: ""
      forzar:
        description: "Revisar aunque no le toque"
        type: boolean
        default: false
      simulacro:
        description: "Revisar sin escribir ni lanzar nada"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  vigilar:
    # Los secretos (AZURE_LAGO_URL, ZYTE_API_KEY, MONGO_URI) viven en el environment "amatista1".
    environment: amatista1
    # Las corridas programadas solo arrancan con la variable G7B_INGESTA_ACTIVA = true;
    # las manuales (Run workflow) siempre.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.G7B_INGESTA_ACTIVA == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lago.txt
      - name: Vigilar
        env:
          AZURE_LAGO_URL: ${{ secrets.AZURE_LAGO_URL }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          ZYTE_PROJECT_ID: ${{ vars.ZYTE_PROJECT_ID || '883618' }}
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
          FUENTE: ${{ inputs.fuente }}
          FORZAR: ${{ inputs.forzar }}
          SIMULACRO: ${{ inputs.simulacro }}
        run: |
          args=()
          if [ -n "$FUENTE" ]; then args+=(--fuente "$FUENTE"); fi
          if [ "$FORZAR" = "true" ]; then args+=(--forzar); fi
          if [ "$SIMULACRO" = "true" ]; then args+=(--simulacro); fi
          python -m g7b_ingesta.vigilar "${args[@]}"
