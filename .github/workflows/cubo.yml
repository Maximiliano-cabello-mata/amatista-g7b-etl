name: Cubo G7B

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'g7b_almacen/**'
      - 'requirements-cubo.txt'
      - '.github/workflows/cubo.yml'
  workflow_run:
    workflows: ['Telemetría G7B']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cubo-g7b-publicacion
  cancel-in-progress: false

jobs:
  construir:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: amatista1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-cubo.txt
      - name: Autenticar Azure mediante OIDC (sin SAS)
        if: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Construir, publicar y verificar
        env:
          AZURE_LAGO_URL: ${{ secrets.AZURE_LAGO_URL }}
          AZURE_STORAGE_ACCOUNT_URL: ${{ vars.AZURE_STORAGE_ACCOUNT_URL }}
        run: |
          { test -n "$AZURE_LAGO_URL" || test -n "$AZURE_STORAGE_ACCOUNT_URL"; } || { echo 'Falta acceso Azure: OIDC o SAS'; exit 1; }
          python -m g7b_almacen.cubo --azure --salida resultado-cubo
          python -m g7b_almacen.descargar verificacion/cubo.duckdb
      - uses: actions/upload-artifact@v4
        with:
          name: cubo-${{ github.run_id }}
          path: resultado-cubo/
          retention-days: 14
