name: Validar arquitectura privada de Azure

on:
  push:
    branches:
      - chatgpt/g7b-arquitectura-privada-ofertas-20261101
    paths:
      - .github/workflows/validar_azure_privado.yml
      - infra/azure/g7b-control-privado.bicep
      - infra/azure/validar_y_aprovisionar.sh
      - infra/ofertas/catalogo.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_bicep:
    name: Bicep sin credenciales y controles de seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compilar IaC sin contacto con la suscripcion
        shell: bash
        run: |
          az bicep install
          az bicep build --file infra/azure/g7b-control-privado.bicep --outfile /tmp/g7b-azure.json
          python - <<'PY'
          import json
          from pathlib import Path
          arm = json.loads(Path("/tmp/g7b-azure.json").read_text())
          recursos = json.dumps(arm).lower()
          assert "microsoft.app/jobs" in recursos
          assert "microsoft.authorization/roleassignments" in recursos
          assert "manual" in recursos
          assert "accountkey=" not in recursos and "sig=" not in recursos
          print("G7B_BICEP_VALIDO")
          PY
      - name: Reglas y sintaxis del inventario
        shell: bash
        run: |
          bash -n infra/azure/validar_y_aprovisionar.sh
          bash -n infra/azure/diagnosticar_cloud_shell.sh
          python herramientas/validar_catalogo.py
      - name: Preparar instrucciones
        run: |
          echo "### Arquitectura analizada sin acceso a Azure ni despliegues" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bicep compilado: correcto" >> "$GITHUB_STEP_SUMMARY"
          echo "- Permisos: lectura sobre el contenedor del lago" >> "$GITHUB_STEP_SUMMARY"
          echo "- Job: solo arranque manual; sin endpoint HTTP" >> "$GITHUB_STEP_SUMMARY"
