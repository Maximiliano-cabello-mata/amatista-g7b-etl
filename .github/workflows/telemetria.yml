name: Telemetría G7B

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telemetria.yml'
      - 'g7b_telemetria/**'
      - 'fuentes/hardware.yml'
      - 'sonda/g7b_sonda.py'
  workflow_dispatch:
    inputs:
      publicar_azure:
        description: Guardar y verificar en Azure
        type: boolean
        default: true
  # Sin horario propio: el ciclo (ciclo.yml) la lanza una vez por semana.

permissions:
  contents: read

concurrency:
  group: telemetria-g7b
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-24.04
    environment: amatista1
    timeout-minutes: 60   # el archivo completo de Open Data se recorre por tandas
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-lago.txt
      - name: Instalar Blender de Ubuntu
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Medir CPU en el runner (no representa computadoras personales)
        run: blender -b --factory-startup --python-exit-code 1 --python sonda/g7b_sonda.py -- --salida resultados-sonda --escena ligera --perfiles ligero --repeticiones 3 --sin-render --entorno github_actions
      - name: Recopilar las fuentes de telemetría de Amatista
        env:
          AZURE_LAGO_URL: ${{ secrets.AZURE_LAGO_URL }}
          PUBLICAR: ${{ github.event_name != 'workflow_dispatch' || inputs.publicar_azure }}
        run: |
          args=(--limite 2000)
          if [ "$PUBLICAR" = "true" ]; then
            args=(--azure --limite 20000)
          fi
          python -m g7b_telemetria --sondas resultados-sonda --salida captura/telemetria-amatista "${args[@]}"
      - name: Conservar informes y mediciones (sin snapshot completo)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: telemetria-${{ github.run_id }}
          retention-days: 14
          path: |
            captura/**/informe.json
            captura/**/mediciones.jsonl
            captura/**/compatibilidad.jsonl
            captura/**/sonda-aframe/*.jsonl
