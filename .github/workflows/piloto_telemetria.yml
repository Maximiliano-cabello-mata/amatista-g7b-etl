name: Piloto de telemetría de Amatista
on:
  pull_request:
    paths:
      - 'g7b_telemetria/**'
      - 'sonda/**'
      - 'pruebas/piloto_aframe.py'
      - '.github/workflows/piloto_telemetria.yml'
permissions:
  contents: read
concurrency:
  group: piloto-telemetria-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  piloto:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-lago.txt
      - name: Preparar Blender 4.2.20 LTS con el checksum de la distribución
        working-directory: ${{ runner.temp }}
        run: |
          version=4.2.20
          base=https://download.blender.org/release/Blender4.2
          archivo="blender-$version-linux-x64.tar.xz"
          curl --fail --location --retry 2 --max-time 60 "$base/blender-$version.sha256" -o blender.sha256
          curl --fail --location --retry 2 --max-time 180 "$base/$archivo" -o "$archivo"
          sha256sum --check --ignore-missing blender.sha256
          tar -xf "$archivo"
          echo "$RUNNER_TEMP/blender-$version-linux-x64" >> "$GITHUB_PATH"
      - name: Medir la escena ligera en el runner
        run: blender -b --factory-startup --python-exit-code 1 --python sonda/g7b_sonda.py -- --salida sonda-piloto --escena ligera --perfiles ligero --repeticiones 3 --sin-render --entorno github_actions
      - name: Medir una escena A-Frame en Chromium con WebGL por software
        run: |
          pip install 'selenium>=4.24,<5'
          curl --fail --location --retry 2 https://aframe.io/releases/1.7.0/aframe.min.js -o "$RUNNER_TEMP/aframe.min.js"
          python pruebas/piloto_aframe.py "$RUNNER_TEMP/aframe.min.js" "$RUNNER_TEMP/medicion-aframe.json"
      - name: Recibir las cuatro fuentes con datos reales
        run: python -m g7b_telemetria --sondas sonda-piloto --aframe "$RUNNER_TEMP/medicion-aframe.json" --limite 5 --salida piloto
      - name: Comprobar procedencia, unidades y cobertura
        shell: python
        run: |
          import json
          from pathlib import Path
          raiz = Path('piloto')
          informe = json.loads((raiz / 'informe.json').read_text())
          fuentes = {r['fuente']: r for r in informe['fuentes'] if r['activa']}
          assert set(fuentes) == {'sonda-g7b', 'blender-open-data', 'caniuse-web3d', 'sonda-aframe'}
          assert all(r['estado'] == 'recibida' for r in fuentes.values())
          assert informe['destino'] == 'local'
          for clave, fila in fuentes.items():
              print(clave, json.dumps(fila['informe'], ensure_ascii=False))
          datos = [json.loads(s) for f in (raiz / 'sonda-g7b').rglob('mediciones.jsonl') for s in f.read_text().splitlines()]
          assert datos and all(d['entorno'] == 'github_actions' for d in datos)
          publicos = [json.loads(s) for s in (raiz / 'blender-open-data/mediciones.jsonl').read_text().splitlines()]
          assert publicos and all(d['unidad'] == 'samples/min' and d['estado'] == 'revision' for d in publicos)
          assert fuentes['caniuse-web3d']['informe']['funciones'] == 6
          web = json.loads(next((raiz / 'sonda-aframe').glob('*.jsonl')).read_text())
          assert web['entorno'] == 'github_actions' and web['max_triangulos'] >= 12
          assert web['intervalos'] > 0 and web['fps_observados'] > 0
          print('A-Frame en CI', json.dumps(web))
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: piloto-telemetria-amatista
          path: |
            piloto/**/informe.json
            piloto/**/*.jsonl
          retention-days: 14
