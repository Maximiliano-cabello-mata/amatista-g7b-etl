name: Geoda kernel
# Construye el paquete de conocimiento del kernel (g7b.geoda.paquete/1) desde el cubo VIGENTE del lago
# (control/cubo_actual.json, con sus huellas verificadas), comprueba las citas del manual contra los
# objects.inv, corre los casos de conformidad y publica:
#   - en el lago: oro/geoda/<versión>/paquete.json + control/geoda_paquete_actual.json
#   - en el repositorio: publicacion/geoda_paquete.json (la copia pública que lee el núcleo)
# Solo si el contenido cambió. El paquete lleva solo agregados (geoda/paquete.py valida que no haya
# huellas ni mediciones individuales).
on:
  push:
    branches: [main]
    paths: ['geoda/**', 'fuentes/citas_manual.yml', 'fuentes/hardware.yml', '.github/workflows/geoda_kernel.yml']
  workflow_dispatch:
  # Sin workflow_run: el ciclo (ciclo.yml) lo lanza después del cubo.
permissions:
  contents: write
concurrency:
  group: geoda-publicacion
  cancel-in-progress: false
jobs:
  paquete:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: amatista1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-cubo.txt
      - name: Construir el paquete desde el cubo del lago
        env:
          AZURE_LAGO_URL: ${{ secrets.AZURE_LAGO_URL }}
        run: |
          test -n "$AZURE_LAGO_URL" || { echo 'Falta AZURE_LAGO_URL en amatista1'; exit 1; }
          python -m g7b_almacen.paquete_geoda --trabajo "$RUNNER_TEMP/geoda" --publico publicacion/geoda_paquete.json
      - name: Conformidad del núcleo con el paquete publicado
        run: python -m geoda conformidad --paquete publicacion/geoda_paquete.json > "$RUNNER_TEMP/conformidad.json" || { cat "$RUNNER_TEMP/conformidad.json"; exit 1; }
      - name: Publicar en el repositorio solo si cambió
        run: |
          git add -- publicacion/geoda_paquete.json
          if git diff --cached --quiet; then
            echo "Paquete sin cambios"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data(geoda): publicar paquete de conocimiento del kernel [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: geoda-paquete-${{ github.run_id }}
          path: |
            publicacion/geoda_paquete.json
            ${{ runner.temp }}/conformidad.json
          retention-days: 30
          if-no-files-found: ignore
