name: Geoda kernel
on:
  workflow_dispatch:
    inputs:
      cubo_run_id:
        type: string
        required: true
        description: Ejecución de Cubo G7B cuya entrega se quiere reproducir
permissions:
  contents: read
  actions: read
jobs:
  planificar:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install duckdb==2.0.0
      - name: Verificar el origen de la reproducción
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_CUBO: ${{ inputs.cubo_run_id }}
        run: |
          [[ "$RUN_CUBO" =~ ^[0-9]+$ ]]
          origen=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_CUBO" --jq '[.path,.head_branch,.conclusion] | join(" ")')
          test "$origen" = ".github/workflows/cubo.yml main success"
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.cubo_run_id }}
          name: cubo-${{ inputs.cubo_run_id }}
          path: insumo
      - run: python -m geoda.ejecutar --entrada insumo --salida salida
      - uses: actions/upload-artifact@v6
        with:
          name: geoda-${{ github.run_id }}-cubo-${{ inputs.cubo_run_id }}
          path: salida/
          retention-days: 14
