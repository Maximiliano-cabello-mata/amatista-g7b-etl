name: Procesar bronce

# Cada noche, después de "Zyte al lago", Geodar Radar enruta lo nuevo de bronce según su destino:
#   documentos  → embudo → plata → MongoDB conocimiento_3d.documentos
#   catalogo    → MongoDB g7b_catalogo (texturas, HDRI, modelos, herramientas, extensiones)
#   senales     → oro/senales/semanal.json en Azure (+ g7b_panel.senales para Atlas Charts)
#   telemetria  → se queda en bronce para el cubo del warehouse
on:
  schedule:
    - cron: "47 10 * * *"  # 10:47 UTC = 04:47 en la Ciudad de México
  workflow_dispatch:
    inputs:
      simulacro:
        description: "Evaluar sin escribir"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  procesar:
    # Los secretos (AZURE_LAGO_URL, ZYTE_API_KEY, MONGO_URI) viven en el environment "amatista1".
    environment: amatista1
    # Las corridas programadas solo arrancan con la variable G7B_INGESTA_ACTIVA = true;
    # las manuales (Run workflow) siempre.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.G7B_INGESTA_ACTIVA == 'true' }}
    runs-on: ubuntu-latest
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lago.txt
      - name: Procesar
        env:
          AZURE_LAGO_URL: ${{ secrets.AZURE_LAGO_URL }}
          SIMULACRO: ${{ inputs.simulacro }}
        run: |
          if [ "$SIMULACRO" = "true" ]; then
            python -m geodar procesar --simulacro
          else
            python -m geodar procesar
          fi
      - name: Publicar lo aceptado en MongoDB (oro)
        if: ${{ env.MONGO_URI != '' }}
        env:
          AZURE_LAGO_URL: ${{ secrets.AZURE_LAGO_URL }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SIMULACRO: ${{ inputs.simulacro }}
        run: |
          if [ "$SIMULACRO" = "true" ]; then
            python -m geodar publicar --simulacro
          else
            python -m geodar publicar
          fi
      - name: Catálogos a MongoDB (texturas, modelos, herramientas)
        if: ${{ env.MONGO_URI != '' }}
        env:
          AZURE_LAGO_URL: ${{ secrets.AZURE_LAGO_URL }}
          SIMULACRO: ${{ inputs.simulacro }}
        run: |
          if [ "$SIMULACRO" = "true" ]; then
            python -m geodar catalogar --simulacro
          else
            python -m geodar catalogar
          fi
      - name: Señales de los foros (resumen semanal)
        env:
          AZURE_LAGO_URL: ${{ secrets.AZURE_LAGO_URL }}
          SIMULACRO: ${{ inputs.simulacro }}
        run: |
          if [ "$SIMULACRO" = "true" ]; then
            python -m geodar senales --simulacro
          else
            python -m geodar senales
          fi
