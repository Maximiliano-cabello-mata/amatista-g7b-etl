name: Procesar bronce

# Cada noche, después de "Zyte al lago", Geodar Radar enruta lo nuevo de bronce según su destino:
#   documentos  → embudo → plata → MongoDB conocimiento_3d.documentos
#   catalogo    → MongoDB g7b_catalogo (texturas, HDRI, modelos, herramientas, extensiones)
#   senales     → oro/senales/semanal.json en Azure (+ g7b_panel.senales para Atlas Charts)
#   telemetria  → se queda en bronce para el cubo del warehouse
on:
  # Sin horario propio: lo lanza el ciclo (ciclo.yml), que es el único reloj del flujo.
  workflow_dispatch:
    inputs:
      simulacro:
        description: "Evaluar sin escribir"
        type: boolean
        default: true
      fuente:
        description: "Reevaluar solo esta fuente (id del catálogo); vacío = todas"
        type: string
        default: ""
      lote:
        description: "Reevaluar solo los archivos de bronce que empiezan así (ej. bronce/arxiv-cs-gr/2026-11-11/)"
        type: string
        default: ""
      forzar:
        description: "Reevaluar aunque las reglas no hayan cambiado"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  procesar:
    # Los secretos (AZURE_LAGO_URL, ZYTE_API_KEY, MONGO_URI) viven en el environment "amatista1".
    environment: amatista1
    # Activo por defecto aquí. Configurar la variable en false para pausar el calendario.
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.G7B_INGESTA_ACTIVA == 'true' || (vars.G7B_INGESTA_ACTIVA == '' && github.repository == 'Maximiliano-cabello-mata/amatista-g7b-etl')) }}
    runs-on: ubuntu-latest
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lago.txt
      - name: Procesar
        env:
          AZURE_LAGO_URL: ${{ secrets.AZURE_LAGO_URL }}
          SIMULACRO: ${{ inputs.simulacro }}
          FUENTE: ${{ inputs.fuente }}
          LOTE: ${{ inputs.lote }}
          FORZAR: ${{ inputs.forzar }}
        run: |
          # Además de lo nuevo, reevalúa solo lo que se evaluó con reglas distintas (procesar.py).
          args=()
          if [ "$SIMULACRO" = "true" ]; then args+=(--simulacro); fi
          if [ -n "$FUENTE" ]; then args+=(--fuente "$FUENTE"); fi
          if [ -n "$LOTE" ]; then args+=(--lote "$LOTE"); fi
          if [ "$FORZAR" = "true" ]; then args+=(--forzar); fi
          python -m geodar procesar "${args[@]}"
      - name: Publicar lo aceptado en MongoDB (oro)
        if: ${{ env.MONGO_URI != '' }}
        env:
          AZURE_LAGO_URL: ${{ secrets.AZURE_LAGO_URL }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SIMULACRO: ${{ inputs.simulacro }}
        run: |
          if [ "$SIMULACRO" = "true" ]; then
            python -m geodar publicar --simulacro
          else
            python -m geodar publicar
          fi
      - name: Catálogos a MongoDB (texturas, modelos, herramientas)
        if: ${{ env.MONGO_URI != '' }}
        env:
          AZURE_LAGO_URL: ${{ secrets.AZURE_LAGO_URL }}
          SIMULACRO: ${{ inputs.simulacro }}
        run: |
          if [ "$SIMULACRO" = "true" ]; then
            python -m geodar catalogar --simulacro
          else
            python -m geodar catalogar
          fi
      - name: Señales de los foros (resumen semanal)
        env:
          AZURE_LAGO_URL: ${{ secrets.AZURE_LAGO_URL }}
          SIMULACRO: ${{ inputs.simulacro }}
        run: |
          if [ "$SIMULACRO" = "true" ]; then
            python -m geodar senales --simulacro
          else
            python -m geodar senales
          fi
