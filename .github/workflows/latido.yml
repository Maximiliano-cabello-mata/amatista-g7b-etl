name: Latido (orquestador por fases)

# El corazón del 24/7: corre cada hora y avanza UN paso acotado del pipeline
# (ingesta -> cubo -> compuerta de calidad). Cada fase se enciende solo cuando tiene trabajo y se
# apaga pasando el turno; no hace todo de un golpe. Necesita AZURE_LAGO_URL; sin ella, no corre.
on:
  schedule:
    - cron: "0 * * * *"   # cada hora en punto
  workflow_dispatch:
    inputs:
      pasos:
        description: "Cuántos pasos avanzar en esta corrida"
        type: choice
        options: ["1", "3"]
        default: "1"

permissions:
  contents: read

concurrency:
  group: latido
  cancel-in-progress: false

jobs:
  latido:
    environment: amatista1
    if: ${{ github.event_name == 'workflow_dispatch' || vars.G7B_INGESTA_ACTIVA == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZURE_LAGO_URL: ${{ secrets.AZURE_LAGO_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-almacen.txt
      - name: Avanzar el pipeline
        run: |
          for i in $(seq 1 ${{ inputs.pasos || 1 }}); do
            python -m g7b_almacen latido
          done
